[project]
name = "hyper-voice"
version = "0.1.0"
description = "Boost muddy dialogue in movie/show rips via ffmpeg center-channel boost and loudness normalization."
requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "typer>=0.12",
]

[project.scripts]
hyper-voice = "core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = ["pre-commit>=4.0", "pytest>=8.0", "ruff>=0.14"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"] # Long FFmpeg filter expressions are clearer unwrapped.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
